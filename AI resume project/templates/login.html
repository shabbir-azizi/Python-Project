{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <h2>Login</h2>

        <p class="sub-text">
            Welcome back to your AI Career Journey
        </p>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="switch-auth">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>

    </div>
</div>

{% endblock %}
